name: trumpflood daily run

# Three runs a day: 03:37 / 10:37 / 16:37 UTC.
# In CEST (summer, UTC+2) that is 05:37 / 12:37 / 18:37 local; site
# typically visible by 07:00 / 13:00 / 19:00 CEST after fetch, render,
# push and GitHub Pages deploy.
# In CET (winter, UTC+1) the same cron fires one hour earlier locally,
# i.e. visible ~06:00 / 12:00 / 18:00 CET.
#
# Why off-the-hour (:37)?
# GitHub's scheduled workflows get heavily delayed at the top of the
# hour when millions of other crons fire. The :37 offset dodges that
# stampede and cuts typical lag by 10-30 min. We also trigger ~75 min
# before the desired visible time because morning runs can still drift.
#
# Also triggerable manually from the Actions tab ("Run workflow" button).

on:
  schedule:
    - cron: "37 3,10,16 * * *"
  workflow_dispatch:

# Needed so the job can push commits back to the repo.
permissions:
  contents: write

# Only one run at a time; if a new schedule fires while the previous is
# still running, the newer one waits.
concurrency:
  group: trumpflood
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Default persist-credentials stays on so `git push` at the end works
          # with the auto-provisioned GITHUB_TOKEN.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _trumpflood/requirements.txt

      - name: Install dependencies
        working-directory: _trumpflood
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py (fetch + assess + render)
        working-directory: _trumpflood
        run: |
          python main.py

      - name: Commit + push updated site
        run: |
          set -e
          git config user.name "trumpflood-bot"
          git config user.email "trumpflood-bot@andriesfluit.be"

          # Stage only the paths this workflow owns. Leaves portfolio
          # edits or anything else the user has touched alone.
          git add -A trumpflood/ _trumpflood/data/log.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          git commit -m "trumpflood: update for $STAMP"
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Trumpflood run summary" >> $GITHUB_STEP_SUMMARY
          if [ -f _trumpflood/data/log.json ]; then
            LAST=$(python -c "import json; r=json.load(open('_trumpflood/data/log.json'))[-1]; print(f\"{r['date']}  zone={r['zone']}  pct={r['percentage']}%  rank={r['rank']}  dom={r['dominance']}  breadth={r['breadth']}\")")
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$LAST" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

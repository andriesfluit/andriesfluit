name: mediamonitor bikon radar

# Bikon business/market/tech radar. Lighter cadence than the akkanto monitor:
# Mon/Wed/Fri only, aimed at the inbox by ~08:00 Brussels time.
# Two crons so the same local time works across DST:
#   05:40 UTC  → 07:40 CEST (summer)
#   06:40 UTC  → 07:40 CET  (winter)
# Staggered ~10 min after the akkanto monitor (05:30/06:30) so the two
# workflows do not race on git push (they commit different state files;
# both also `git pull --rebase` before pushing for safety).
#
# Also triggerable manually from the Actions tab.

on:
  schedule:
    - cron: "40 5 * * 1,3,5"
    - cron: "40 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Force lookback window in hours (test run). Leave empty for a normal run. A test run does NOT update the schedule clock."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mediamonitor-bikon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip if already sent today
        id: gate
        run: |
          # Force-run only for explicit test dispatches (a lookback_hours
          # override). Every other trigger (scheduled cron, or a plain dispatch
          # from the cloud cron backstop) dedupes on the day stamp, so firing
          # the dispatch daily is idempotent and never double-sends.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Forced test run (lookback ${{ github.event.inputs.lookback_hours }}h)."
            exit 0
          fi
          STAMP_FILE="_mediamonitor/data/last_sent_bikon.txt"
          TODAY=$(TZ=Europe/Brussels date '+%Y-%m-%d')
          STAMPED_DAY=$( [ -f "$STAMP_FILE" ] && head -c 10 "$STAMP_FILE" || echo "" )
          if [ "$STAMPED_DAY" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already sent for $TODAY; skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _mediamonitor/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bikon radar
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:             ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:     ${{ secrets.GMAIL_APP_PASSWORD }}
          BIKON_MONITOR_TO_ADDR:  ${{ secrets.BIKON_MONITOR_TO_ADDR }}
        run: |
          if [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            echo "Test run: forced lookback of ${{ github.event.inputs.lookback_hours }}h (schedule clock untouched)."
            python main.py --profile bikon --lookback-hours "${{ github.event.inputs.lookback_hours }}"
          else
            python main.py --profile bikon
          fi

      - name: Stamp send time
        # Skip stamping on forced-lookback test runs so they do not disturb the
        # Mon/Wed/Fri schedule clock.
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.lookback_hours == ''
        run: |
          mkdir -p _mediamonitor/data
          TZ=Europe/Brussels date '+%Y-%m-%dT%H:%M:%S%:z' > _mediamonitor/data/last_sent_bikon.txt
          git config user.name "mediamonitor-bot"
          git config user.email "mediamonitor-bot@andriesfluit.be"
          git add _mediamonitor/data/last_sent_bikon.txt
          if ! git diff --cached --quiet; then
            STAMP_DAY=$(head -c 10 _mediamonitor/data/last_sent_bikon.txt)
            git commit -m "mediamonitor-bikon: sent $STAMP_DAY"
            # Rebase on top of anything the akkanto track pushed since checkout
            # so the two workflows never collide on push.
            git pull --rebase --autostash
            git push
          fi

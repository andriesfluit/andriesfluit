name: mediamonitor daily run

# Weekday briefing aimed at the inbox by ~08:00 Brussels time.
# Two crons so the same local time works across DST:
#   05:30 UTC  → 07:30 CEST (summer)
#   06:30 UTC  → 07:30 CET  (winter)
# Whichever cron is "wrong" for the current season fires an hour early and
# skips via the idempotency gate (today already sent → exit). Run target
# 07:30 leaves ~30 min for GitHub Actions scheduler drift + pipeline runtime
# (fetch + dedup + LLM + enrichment ≈ 3-5 min on a busy day).
#
# Only Mon-Fri. The lookback window in main.py uses last_sent.txt, so the
# Monday mail automatically covers Friday evening → Monday morning.
#
# Also triggerable manually from the Actions tab.

on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Force lookback window in hours (test run). Leave empty for a normal run. A test run does NOT update the schedule clock."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mediamonitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip if already sent today
        id: gate
        run: |
          # Force-run only for explicit test dispatches (a lookback_hours
          # override). Every other trigger (scheduled cron, or a plain dispatch
          # from the cloud cron backstop) dedupes on the day stamp, so firing
          # the dispatch daily is idempotent and never double-sends.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Forced test run (lookback ${{ github.event.inputs.lookback_hours }}h)."
            exit 0
          fi
          STAMP_FILE="_mediamonitor/data/last_sent.txt"
          TODAY=$(TZ=Europe/Brussels date '+%Y-%m-%d')
          # last_sent.txt now holds an ISO datetime; we only care about the
          # calendar-day prefix for the dedupe-the-two-DST-crons logic.
          STAMPED_DAY=$( [ -f "$STAMP_FILE" ] && head -c 10 "$STAMP_FILE" || echo "" )
          if [ "$STAMPED_DAY" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already sent for $TODAY; skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _mediamonitor/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mediamonitor
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONITOR_TO_ADDR:    ${{ secrets.MONITOR_TO_ADDR }}
        run: |
          if [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            echo "Test run: forced lookback of ${{ github.event.inputs.lookback_hours }}h (schedule clock untouched)."
            python main.py --lookback-hours "${{ github.event.inputs.lookback_hours }}"
          else
            python main.py
          fi

      - name: Stamp send time
        # Skip stamping on forced-lookback test runs so they do not disturb the
        # weekday schedule clock.
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.lookback_hours == ''
        run: |
          mkdir -p _mediamonitor/data
          # ISO datetime with Brussels offset. main.py reads this to compute
          # the lookback window for the NEXT run, so a precise timestamp
          # (not just a date) prevents under- or over-coverage.
          TZ=Europe/Brussels date '+%Y-%m-%dT%H:%M:%S%:z' > _mediamonitor/data/last_sent.txt
          git config user.name "mediamonitor-bot"
          git config user.email "mediamonitor-bot@andriesfluit.be"
          git add _mediamonitor/data/last_sent.txt
          if ! git diff --cached --quiet; then
            STAMP_DAY=$(head -c 10 _mediamonitor/data/last_sent.txt)
            git commit -m "mediamonitor: sent $STAMP_DAY"
            # Rebase on top of anything the Bikon track pushed since checkout
            # so the two workflows never collide on push.
            git pull --rebase --autostash
            git push
          fi

name: mediamonitor daily run

# Weekday briefing aimed at the inbox by ~08:00 Brussels time.
# Two crons so the same local time works across DST:
#   05:30 UTC  → 07:30 CEST (summer)
#   06:30 UTC  → 07:30 CET  (winter)
# Whichever cron is "wrong" for the current season fires an hour early and
# skips via the idempotency gate (today already sent → exit). Run target
# 07:30 leaves ~30 min for GitHub Actions scheduler drift + pipeline runtime
# (fetch + dedup + LLM + enrichment ≈ 3-5 min on a busy day).
#
# Only Mon-Fri. The lookback window in main.py uses last_sent.txt, so the
# Monday mail automatically covers Friday evening → Monday morning.
#
# Also triggerable manually from the Actions tab.

on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediamonitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip if already sent today
        id: gate
        run: |
          # Manual "Run workflow" triggers always run — the idempotency gate
          # is only there to dedupe the two scheduled crons (DST coverage).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Manual trigger — bypassing idempotency gate."
            exit 0
          fi
          STAMP_FILE="_mediamonitor/data/last_sent.txt"
          TODAY=$(TZ=Europe/Brussels date '+%Y-%m-%d')
          # last_sent.txt now holds an ISO datetime; we only care about the
          # calendar-day prefix for the dedupe-the-two-DST-crons logic.
          STAMPED_DAY=$( [ -f "$STAMP_FILE" ] && head -c 10 "$STAMP_FILE" || echo "" )
          if [ "$STAMPED_DAY" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already sent for $TODAY; skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _mediamonitor/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mediamonitor
        if: steps.gate.outputs.skip != 'true'
        working-directory: _mediamonitor
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONITOR_TO_ADDR:    ${{ secrets.MONITOR_TO_ADDR }}
        run: |
          python main.py

      - name: Stamp send time
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p _mediamonitor/data
          # ISO datetime with Brussels offset. main.py reads this to compute
          # the lookback window for the NEXT run, so a precise timestamp
          # (not just a date) prevents under- or over-coverage.
          TZ=Europe/Brussels date '+%Y-%m-%dT%H:%M:%S%:z' > _mediamonitor/data/last_sent.txt
          git config user.name "mediamonitor-bot"
          git config user.email "mediamonitor-bot@andriesfluit.be"
          git add _mediamonitor/data/last_sent.txt
          if ! git diff --cached --quiet; then
            STAMP_DAY=$(head -c 10 _mediamonitor/data/last_sent.txt)
            git commit -m "mediamonitor: sent $STAMP_DAY"
            git push
          fi

name: destandaard probe (public endpoints?)

# One-off diagnostic: runs check_public.py from GitHub's open internet to see
# whether the De Standaard JSON (incl. full article text) is reachable without
# login. Triggers when the probe script is pushed, or manually. Safe to delete
# once we know the answer.

on:
  push:
    paths:
      - "_destandaard/check_public.py"
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition ID to probe"
        required: false
        default: "3307"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe DS endpoints (no auth)
        run: python _destandaard/check_public.py "${{ github.event.inputs.edition || '3307' }}"

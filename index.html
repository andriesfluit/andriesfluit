<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photography by Andries Fluit. Amateur photographer exploring quiet moments through travel and documentary photography.">
    <title>Andries Fluit</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

        :root {
            --bg: #f5f4f0;
            --text: #1a1a1a;
            --text-light: #666;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--bg);
            z-index: 1000;
            padding: 1.5rem 0;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-name {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .site-name a {
            color: var(--text);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 2.5rem;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-light);
        }

        nav a.active {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Main */
        main {
            padding-top: 100px;
            min-height: 100vh;
        }

        /* Masonry Grid */
        .photo-grid {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 6rem 8rem;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4rem 3rem;
        }

        .photo-item {
            cursor: pointer;
            overflow: hidden;
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.3s ease;
        }

        .photo-item:hover img {
            opacity: 0.85;
        }

        /* Asymmetric layout - varied sizes, generous spacing */
        .photo-item:nth-child(1) { grid-column: 1 / 7; }
        .photo-item:nth-child(2) { grid-column: 8 / 13; margin-top: 10rem; }
        .photo-item:nth-child(3) { grid-column: 2 / 7; margin-top: 6rem; }
        .photo-item:nth-child(4) { grid-column: 7 / 12; margin-top: 8rem; }
        .photo-item:nth-child(5) { grid-column: 1 / 5; margin-top: 6rem; }
        .photo-item:nth-child(6) { grid-column: 6 / 12; margin-top: 10rem; }
        .photo-item:nth-child(7) { grid-column: 2 / 6; margin-top: 6rem; }
        .photo-item:nth-child(8) { grid-column: 7 / 13; margin-top: 8rem; }
        .photo-item:nth-child(9) { grid-column: 1 / 6; margin-top: 6rem; }
        .photo-item:nth-child(10) { grid-column: 7 / 11; margin-top: 10rem; }
        .photo-item:nth-child(11) { grid-column: 3 / 8; margin-top: 6rem; }
        .photo-item:nth-child(12) { grid-column: 8 / 13; margin-top: 8rem; }
        .photo-item:nth-child(13) { grid-column: 1 / 5; margin-top: 6rem; }
        .photo-item:nth-child(14) { grid-column: 6 / 12; margin-top: 10rem; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 244, 240, 0.98);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 3rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-image {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
        }

        .modal-info {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
        }

        .modal-meta {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .close-modal {
            position: fixed;
            top: 1.5rem;
            right: 3rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            z-index: 2001;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            color: var(--text-light);
        }

        /* Footer */
        footer {
            padding: 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        footer p, footer a {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        footer a {
            text-decoration: none;
        }

        footer a:hover {
            color: var(--text);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .photo-item {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        .photo-item:nth-child(1) { animation-delay: 0.1s; }
        .photo-item:nth-child(2) { animation-delay: 0.15s; }
        .photo-item:nth-child(3) { animation-delay: 0.2s; }
        .photo-item:nth-child(4) { animation-delay: 0.25s; }
        .photo-item:nth-child(5) { animation-delay: 0.3s; }
        .photo-item:nth-child(6) { animation-delay: 0.35s; }
        .photo-item:nth-child(7) { animation-delay: 0.4s; }
        .photo-item:nth-child(8) { animation-delay: 0.45s; }
        .photo-item:nth-child(9) { animation-delay: 0.5s; }
        .photo-item:nth-child(10) { animation-delay: 0.55s; }
        .photo-item:nth-child(11) { animation-delay: 0.6s; }
        .photo-item:nth-child(12) { animation-delay: 0.65s; }
        .photo-item:nth-child(13) { animation-delay: 0.7s; }
        .photo-item:nth-child(14) { animation-delay: 0.75s; }

        /* Responsive */
        @media (max-width: 1024px) {
            .header-content, .photo-grid, footer {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .photo-grid {
                grid-template-columns: repeat(8, 1fr);
            }

            .photo-item:nth-child(1) { grid-column: 1 / 5; margin-top: 0; }
            .photo-item:nth-child(2) { grid-column: 5 / 9; margin-top: 4rem; }
            .photo-item:nth-child(3) { grid-column: 1 / 4; margin-top: 0; }
            .photo-item:nth-child(4) { grid-column: 4 / 8; margin-top: 2rem; }
            .photo-item:nth-child(5) { grid-column: 2 / 6; margin-top: 0; }
            .photo-item:nth-child(6) { grid-column: 5 / 9; margin-top: 3rem; }
            .photo-item:nth-child(7) { grid-column: 1 / 5; margin-top: 0; }
            .photo-item:nth-child(8) { grid-column: 4 / 9; margin-top: 2rem; }
            .photo-item:nth-child(9) { grid-column: 1 / 4; margin-top: 0; }
            .photo-item:nth-child(10) { grid-column: 4 / 8; margin-top: 4rem; }
            .photo-item:nth-child(11) { grid-column: 2 / 6; margin-top: 0; }
            .photo-item:nth-child(12) { grid-column: 5 / 9; margin-top: 2rem; }
            .photo-item:nth-child(13) { grid-column: 1 / 5; margin-top: 0; }
            .photo-item:nth-child(14) { grid-column: 4 / 9; margin-top: 3rem; }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem 0;
            }

            .header-content, .photo-grid, footer {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }

            nav {
                gap: 1.5rem;
            }

            .site-name, nav a {
                font-size: 0.8rem;
            }

            main {
                padding-top: 80px;
            }

            .photo-grid {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            .photo-item {
                margin-top: 0 !important;
            }

            .modal-content {
                padding: 5rem 1.5rem 3rem;
            }

            .close-modal {
                right: 1.5rem;
            }

            .footer-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="site-name">
                <a href="index.html">Andries Fluit</a>
            </div>
            <nav>
                <a href="index.html" class="active">Work</a>
                <a href="about.html">About</a>
                <a href="purchase.html">Prints</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <div id="photoGrid" class="photo-grid"></div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Andries Fluit</p>
            <a href="mailto:hello@andriesfluit.be">hello@andriesfluit.be</a>
        </div>
    </footer>

    <div id="photoModal" class="modal" onclick="closeModal(event)">
        <button class="close-modal" onclick="closeModal()">&times;</button>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImage" class="modal-image" alt="">
            <div class="modal-info">
                <span class="modal-title" id="modalTitle"></span>
                <span class="modal-meta" id="modalMeta"></span>
            </div>
        </div>
    </div>

    <script src="photos.js"></script>
    <script>
        function loadPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            PHOTOS.forEach((photo) => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.onclick = () => openModal(photo);
                item.innerHTML = `<img src="${photo.src}" alt="${photo.title}" loading="lazy">`;
                grid.appendChild(item);
            });
        }

        function openModal(photo) {
            const modal = document.getElementById('photoModal');
            document.getElementById('modalTitle').textContent = photo.title;
            document.getElementById('modalMeta').textContent = `${photo.location}, ${photo.date}`;
            document.getElementById('modalImage').src = photo.src;
            document.getElementById('modalImage').alt = photo.title;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (!event || event.target.id === 'photoModal' || event.target.classList.contains('close-modal')) {
                const modal = document.getElementById('photoModal');
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.onload = loadPhotos;
    </script>
</body>
</html>
